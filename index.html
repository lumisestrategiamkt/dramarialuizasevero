<style>
:root{
  --profundo:#B04A6A; --profundo-escuro:#9A3F5C;
  --petala:#FBE0E6; --nevoa:#FFF4F6; --creme:#FFFAF6;

*{box-sizing:border-box;margin:0}
html{background:var(--creme)}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;color:var(--texto);-webkit-font-smoothing:antialiased}

.tela{min-height:100vh;min-height:100svh;max-width:480px;margin:0 auto;background:var(--creme);overflow:hidden;padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* Capa: foto em destaque que se dissolve no creme da página; o nome fica sobre a dissolução */
.capa{position:relative;padding-top:84%}
.foto{position:absolute;top:0;left:-10%;width:125%;aspect-ratio:1/1;z-index:0}
.foto img{display:block;width:100%;height:100%;object-fit:cover}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,250,246,0) 43%,rgba(255,250,246,.55) 56%,rgba(255,250,246,.93) 67%,var(--creme) 72%)}
.id{position:relative;z-index:2;text-align:center;padding:0 16px}

h1{font-family:'Lora',Georgia,serif;font-weight:500;font-size:clamp(24px,7.5vw,33px);line-height:1.16;letter-spacing:.09em;text-transform:uppercase;color:var(--ameixa)}
.esp{margin-top:12px;font-weight:600;font-size:clamp(10.5px,2.95vw,11.5px);letter-spacing:.2em;text-transform:uppercase;color:var(--profundo)}
.cred{margin-top:6px;font-size:clamp(9.5px,2.6vw,10.5px);letter-spacing:.06em;color:var(--suave)}
.cred span+span::before{content:"";display:inline-block;width:3px;height:3px;margin:0 10px 2px;border-radius:50%;background:var(--ameixa);vertical-align:middle}

.lista{position:relative;z-index:2;display:grid;gap:12px;margin-top:24px;padding:0 20px}
.item{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:14px;min-height:80px;padding:10px 18px 10px 10px;text-decoration:none;text-align:left;border-radius:20px;border:1px solid var(--borda);background:linear-gradient(100deg,#fff 0%,var(--nevoa) 100%);color:var(--ameixa);box-shadow:0 12px 26px -18px rgba(91,58,71,.5);transition:background .15s,border-color .15s}
.ico{display:grid;place-items:center;width:60px;height:60px;border-radius:14px;background:var(--petala)}
.ico svg{width:26px;height:26px;fill:none;stroke:var(--profundo);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:var(--profundo);stroke:none}
.item b{display:block;font-weight:500;font-size:14.5px;line-height:1.25}
.item div span{display:block;font-size:12.5px;font-weight:400;margin-top:2px;color:var(--suave)}
.item:hover{background:var(--nevoa);border-color:var(--profundo)}
.item:focus-visible{outline:3px solid var(--ameixa);outline-offset:3px}

.item.principal{background:var(--profundo);border-color:var(--profundo);color:#fff;box-shadow:0 16px 28px -14px rgba(91,58,71,.6)}
.item.principal .ico{background:rgba(255,255,255,.2)}
.item.principal .ico svg{stroke:#fff}
.item.principal .ico svg .f{fill:#fff}
.item.principal div span{color:#fff;opacity:.95}
.item.principal:hover{background:var(--profundo-escuro);border-color:var(--profundo-escuro)}

@media (min-width:600px){
  html{background:var(--nevoa)}
  body{padding:32px 16px}
  .tela{min-height:0;border-radius:32px;box-shadow:0 24px 60px -28px rgba(91,58,71,.35)}
}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>
